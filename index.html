<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarIv & Co. | Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #fcf9f5; /* Crema suave cálido inspirado en el fondo texturizado del logo */
            --accent-peach: #e8a598;
            --accent-navy: #1f3159;
        }
        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(at 0% 0%, rgba(232, 165, 152, 0.08) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(31, 49, 89, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .modal { display: none; }
        .modal.active { display: flex; }
        .cart-modal { display: none; }
        .cart-modal.active { display: flex; }
        .zoom-modal { display: none; }
        .zoom-modal.active { display: flex; }
        .filter-btn.active { background-color: #1f3159; color: #fff; }
        
        /* Estilos para el visor tipo Walmart / Lupa interactiva fluida */
        .zoom-container {
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            touch-action: none; /* Crucial para evitar scroll de la página al tocar en móviles */
        }
        .zoom-container img {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-40 p-3 border-b border-orange-100">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <!-- Imagen del logo oficial actualizado en el header -->
                <img src="https://i.ibb.co/XxcRJLVM/Gemini-Generated-Image-51tlk651tlk651tl.jpg" alt="MarIv & Co. Logo" class="w-12 h-12 rounded-full object-cover shadow-sm border border-orange-200" onerror="this.src='https://placehold.co/100x100/e8a598/ffffff?text=M';">
                <div>
                    <h1 class="text-xl font-black text-gray-900 tracking-tighter italic">MarIv & CO.</h1>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Tu Zapatería</p>
                </div>
            </div>
            <button onclick="toggleCart()" class="relative p-2.5 bg-orange-50 hover:bg-orange-100 text-gray-800 rounded-full transition shadow-sm">
                <i class="fas fa-shopping-bag text-xl"></i>
                <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
            </button>
        </div>
    </nav>

    <div class="sticky top-[73px] bg-[#fcf9f5]/95 backdrop-blur-md z-30 shadow-sm border-b border-orange-200/60 py-4 px-4 mb-6">
        <div class="max-w-6xl mx-auto flex flex-col gap-4">
            <a href="https://www.facebook.com/share/18kTw7Ak38/" target="_blank" class="flex items-center justify-center gap-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 py-2.5 px-4 rounded-xl text-sm font-bold transition shadow-sm">
                <i class="fab fa-facebook text-blue-600 text-lg"></i>
                <span>Síguenos en Facebook: Zapatería MarIv 👉</span>
            </a>
            
            <input type="text" id="searchInput" placeholder="Buscar modelos o diseños..." class="p-4 rounded-xl w-full border border-orange-200 focus:ring-2 focus:ring-[#1f3159] outline-none bg-white shadow-sm text-sm">
            
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                <div class="flex gap-2 overflow-x-auto pb-2 w-full md:w-auto scrollbar-none">
                    <button onclick="setFilter('all')" id="btn-all" class="filter-btn active px-4 py-2 rounded-full border border-gray-300 text-sm font-bold whitespace-nowrap shadow-xs">Todos</button>
                    <button onclick="setFilter('girls')" id="btn-girls" class="filter-btn px-4 py-2 rounded-full border border-gray-300 text-sm font-bold whitespace-nowrap shadow-xs">Niñas</button>
                    <button onclick="setFilter('boys')" id="btn-boys" class="filter-btn px-4 py-2 rounded-full border border-gray-300 text-sm font-bold whitespace-nowrap shadow-xs">Niños</button>
                    <button onclick="setFilter('woman')" id="btn-woman" class="filter-btn px-4 py-2 rounded-full border border-gray-300 text-sm font-bold whitespace-nowrap shadow-xs">Mujer</button>
                    <button onclick="setFilter('men')" id="btn-men" class="filter-btn px-4 py-2 rounded-full border border-gray-300 text-sm font-bold whitespace-nowrap shadow-xs">Caballero</button>
                    <button onclick="setFilter('tenis')" id="btn-tenis" class="filter-btn px-4 py-2 rounded-full border border-gray-300 text-sm font-bold whitespace-nowrap shadow-xs">Tenis</button>
                    <button onclick="setFilter('mochilas')" id="btn-mochilas" class="filter-btn px-4 py-2 rounded-full border border-blue-300 text-blue-600 bg-blue-50 text-sm font-bold whitespace-nowrap shadow-xs">🎒 Mochilas</button>
                    <button onclick="setFilter('pedido')" id="btn-pedido" class="filter-btn px-4 py-2 rounded-full border border-red-300 text-red-600 bg-red-50 text-sm font-bold whitespace-nowrap shadow-xs">✨ Sobre Pedido</button>
                </div>
                
                <div class="w-full md:w-48">
                    <select id="sizeFilter" onchange="renderProducts(document.getElementById('searchInput').value)" class="p-3 rounded-xl w-full border border-orange-200 bg-white text-sm font-bold focus:ring-2 focus:ring-[#1f3159] outline-none shadow-sm cursor-pointer">
                        <option value="all">Todas las tallas</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4">
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <footer class="max-w-6xl mx-auto px-4 py-12 mt-12 border-t border-orange-200/60 text-center">
        <a href="https://www.facebook.com/share/18kTw7Ak38/" target="_blank" class="inline-flex items-center gap-3 bg-[#1f3159] hover:bg-[#15223f] text-white font-bold py-4 px-8 rounded-2xl shadow-lg transition transform hover:scale-105">
            <i class="fab fa-facebook text-3xl"></i>
            <span class="text-base md:text-lg">Síguenos en Facebook: Zapatería MarIv 👉</span>
        </a>
        <p class="text-xs text-gray-500 mt-6">© 2026 MarIv & Co. Todos los derechos reservados.</p>
    </footer>

    <script>
        const whatsappNumber = "525638737731"; 
        let currentFilter = 'all';
        
        const productsData = [
            { id: 1, name: "Balerina Lulú", category: "woman", material: "Sintético", price: 300, heroImage: "https://i.ibb.co/rK3hx71H/VALERINA-LISO-1-CORREA-NI-A.png", sizes: [24, 26] },
// ... existing code ... -->
        function openModal(id) {
            const product = productsData.find(p => p.id === id);
            document.getElementById('modalImg').src = product.heroImage;
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalPrice').innerText = "$" + product.price;
            document.getElementById('modalMaterial').innerText = "Material: " + product.material;
            
            const badgeBox = document.getElementById('modalBadge');
            if (product.isPreorder) {
                badgeBox.innerHTML = '<span class="bg-red-100 text-red-600 text-xs font-extrabold px-3 py-1 rounded-full inline-block mb-2">✨ Artículo Sobre Pedido (Tiempo de elaboración especificado al cotizar)</span>';
            } else {
                badgeBox.innerHTML = '';
            }
            
            const select = document.getElementById('sizeSelector');
            select.innerHTML = '<option value="">Selecciona una opción</option>';
            product.sizes.forEach(s => {
                select.innerHTML += `<option value="${s}">${typeof s === 'number' ? 'Talla ' + s : s}</option>`;
            });

            document.getElementById('addBtn').onclick = () => addToCart(product.id);
            document.getElementById('modal').classList.add('active');
        }

        function openZoomModal(imgSrc, title) {
            document.getElementById('zoomImg').src = imgSrc;
            document.getElementById('zoomTitle').innerText = title;
            document.getElementById('zoomModal').classList.add('active');
        }

        function closeZoomModal() {
            document.getElementById('zoomModal').classList.remove('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function toggleCart() { document.getElementById('cartModal').classList.toggle('active'); }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-bold py-3 px-6 rounded-2xl shadow-xl z-50 transition opacity-0';
            toast.innerText = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => renderProducts(e.target.value));
        
        initSizeFilter();
        renderProducts();
    </script>

    <div id="zoomModal" class="zoom-modal fixed inset-0 bg-black/90 z-50 items-center justify-center p-2 md:p-6">
        <div class="bg-white rounded-3xl p-4 max-w-4xl w-full relative flex flex-col items-center shadow-2xl max-h-[95vh]">
            <button onclick="closeZoomModal()" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 w-11 h-11 rounded-full flex items-center justify-center transition z-10 shadow"><i class="fas fa-times text-xl text-gray-800"></i></button>
            <h3 id="zoomTitle" class="font-bold text-lg text-gray-900 mb-3 text-center px-10"></h3>
            <div class="w-full flex-1 flex items-center justify-center overflow-auto bg-orange-50/50 rounded-2xl p-2 min-h-[50vh]">
                <img id="zoomImg" class="max-w-full max-h-[75vh] object-contain rounded-xl shadow-md">
            </div>
            <button onclick="closeZoomModal()" class="mt-4 w-full md:w-64 py-3 bg-[#1f3159] text-white rounded-xl font-bold text-sm shadow hover:bg-[#15223f] transition">Cerrar Zoom</button>
        </div>
    </div>

    <div id="modal" class="modal fixed inset-0 bg-black/50 backdrop-blur-xs z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black"><i class="fas fa-times text-xl"></i></button>
            <img id="modalImg" class="w-full h-56 object-contain rounded-2xl mb-3 bg-orange-50/50 cursor-pointer" onclick="openZoomModal(this.src, document.getElementById('modalTitle').innerText)">
            <div id="modalBadge"></div>
            <h2 id="modalTitle" class="text-xl font-bold mb-1 text-gray-900"></h2>
            <p id="modalMaterial" class="text-gray-600 text-xs mb-3"></p>
            <p id="modalPrice" class="text-[#1f3159] font-bold text-xl mb-3"></p>
             
            <label class="block text-sm font-bold text-gray-700 mb-2">Selecciona tu talla o medida:</label>
            <select id="sizeSelector" class="w-full p-3 border border-orange-200 rounded-xl mb-6 text-sm bg-white focus:ring-2 focus:ring-[#1f3159] outline-none"></select>

            <button id="addBtn" class="w-full py-4 bg-[#1f3159] text-white rounded-xl font-bold hover:bg-[#15223f] transition shadow-md">Agregar al Carrito</button>
        </div>
    </div>

    <div id="cartModal" class="cart-modal fixed inset-0 bg-black/50 backdrop-blur-xs z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full relative shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-gray-900">Tu Pedido</h2>
            <div id="cartList" class="mb-4 max-h-60 overflow-y-auto"></div>
            
            <div class="space-y-2 mb-6 border-t pt-4 border-gray-100">
                <div class="flex justify-between text-sm text-gray-600"><span>Subtotal:</span><span id="subtotal" class="font-bold text-gray-800">$0</span></div>
                <div class="flex justify-between text-sm text-gray-600"><span>Envío:</span><span id="shippingFee">Por cotizar</span></div>
                <div class="flex justify-between text-lg font-bold text-gray-900"><span>Total:</span><span id="cartTotal">$0 + Envío</span></div>
            </div>

            <button onclick="checkout()" class="w-full py-4 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold transition shadow-md mb-2 flex items-center justify-center gap-2">
                <i class="fab fa-whatsapp text-lg"></i> Pedir por WhatsApp
            </button>
            <button onclick="toggleCart()" class="w-full py-2 text-gray-500 hover:text-gray-800 text-sm font-medium">Cerrar</button>
        </div>
    </div>
</body>
</html>

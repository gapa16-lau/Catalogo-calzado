        let cart = [];

        function initSizeFilter() {
            const sizeSelect = document.getElementById('sizeFilter');
            const allSizes = new Set();
            productsData.forEach(p => p.sizes.forEach(s => allSizes.add(s)));
            const sortedSizes = Array.from(allSizes).sort((a, b) => {
                if(typeof a === 'number' && typeof b === 'number') return a - b;
                return String(a).localeCompare(String(b));
            });
            
            sizeSelect.innerHTML = '<option value="all">Todas las tallas / medidas</option>';
            sortedSizes.forEach(size => {
                sizeSelect.innerHTML += `<option value="${size}">${typeof size === 'number' ? 'Talla ' + size : size}</option>`;
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${filter}`).classList.add('active');
            renderProducts(document.getElementById('searchInput').value);
        }

        function renderProducts(search = '') {
            const grid = document.getElementById('productGrid');
            const selectedSize = document.getElementById('sizeFilter').value;
            grid.innerHTML = '';
            
            const filtered = productsData.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search.toLowerCase());
                const matchesCategory = (currentFilter === 'all' || p.category === currentFilter);
                const matchesSize = (selectedSize === 'all' || p.sizes.includes(selectedSize) || p.sizes.includes(parseFloat(selectedSize)));
                return matchesSearch && matchesCategory && matchesSize;
            });

            filtered.forEach(p => {
                const badge = p.isPreorder ? `<span class="bg-red-100 text-red-600 text-[10px] font-extrabold px-2 py-0.5 rounded-full mb-1 inline-block">✨ SOBRE PEDIDO</span>` : '';
                grid.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="relative group cursor-pointer" onclick="openZoomModal('${p.heroImage}', '${p.name.replace(/'/g, "\\'")}')">
                                <img src="${p.heroImage}" loading="lazy" class="w-full h-40 object-cover rounded-xl mb-3" onerror="this.src='https://placehold.co/300x300/e8a598/ffffff?text=MarIv';">
                                <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition rounded-xl flex items-center justify-center">
                                    <span class="bg-white/90 text-gray-900 text-xs font-bold px-2.5 py-1 rounded-full shadow opacity-0 group-hover:opacity-100 transition transform scale-90 group-hover:scale-100">
                                        <i class="fas fa-search-plus mr-1"></i> Zoom
                                    </span>
                                </div>
                            </div>
                            ${badge}
                            <h3 class="font-bold text-sm text-gray-800 truncate">${p.name}</h3>
                            <p class="text-green-600 font-semibold mb-3">$${p.price}</p>
                        </div>
                        <button onclick="openModal(${p.id})" class="w-full py-2 bg-[#1f3159] hover:bg-[#15223f] text-white rounded-lg text-sm font-bold shadow-xs transition">Ver Detalles</button>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = productsData.find(p => p.id === id);
            const size = document.getElementById('sizeSelector').value;
            
            if(!size) {
                showToast("Por favor selecciona una talla o medida");
                return;
            }

            cart.push({ ...product, selectedSize: size });
            closeModal();
            updateCartUI();
            showToast("¡Agregado al carrito!");
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const list = document.getElementById('cartList');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('cartTotal');
            
            list.innerHTML = '';
            let subtotal = 0;
            
            cart.forEach((item, index) => {
                subtotal += item.price;
                const preorderTag = item.isPreorder ? '<span class="text-red-500 text-[10px] block font-bold">(Sobre Pedido)</span>' : '';
                list.innerHTML += `
                    <div class="flex justify-between items-center py-2 border-b">
                        <div class="flex flex-col">
                            <span class="text-sm font-bold">${item.name}</span>
                            <span class="text-xs text-gray-500">Talla/Medida: ${item.selectedSize}</span>
                            ${preorderTag}
                        </div>
                        <span class="font-bold">$${item.price}</span>
                        <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash text-xs"></i></button>
                    </div>
                `;
            });
            
            subtotalEl.innerText = `$${subtotal}`;
            totalEl.innerText = `$${subtotal} + Envío`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkout() {
            if(cart.length === 0) return;
            let message = "Hola, me interesa hacer un pedido:%0A";
            cart.forEach(item => {
                const tipo = item.isPreorder ? " [SOBRE PEDIDO]" : "";
                message += `- ${item.name}${tipo} (Talla/Medida: ${item.selectedSize}) - $${item.price}%0A`;
            });
            
            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            
            message += `%0ASubtotal: $${subtotal}`;
            message += `%0AEnvío: Por cotizar`;
            message += `%0ATotal: $${subtotal} + Envío`;
            
            window.open(`https://wa.me/${whatsappNumber}?text=${message}`, '_blank');
        }

        function openModal(id) {
            const product = productsData.find(p => p.id === id);
            document.getElementById('modalImg').src = product.heroImage;
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalPrice').innerText = "$" + product.price;
            document.getElementById('modalMaterial').innerText = "Material: " + product.material;
            
            const badgeBox = document.getElementById('modalBadge');
            if (product.isPreorder) {
                badgeBox.innerHTML = '<span class="bg-red-100 text-red-600 text-xs font-extrabold px-3 py-1 rounded-full inline-block mb-2">✨ Artículo Sobre Pedido (Tiempo de elaboración especificado al cotizar)</span>';
            } else {
                badgeBox.innerHTML = '';
            }
            
            const select = document.getElementById('sizeSelector');
            select.innerHTML = '<option value="">Selecciona una opción</option>';
            product.sizes.forEach(s => {
                select.innerHTML += `<option value="${s}">${typeof s === 'number' ? 'Talla ' + s : s}</option>`;
            });

            document.getElementById('addBtn').onclick = () => addToCart(product.id);
            document.getElementById('modal').classList.add('active');
        }

        function openZoomModal(imgSrc, title) {
            document.getElementById('zoomImg').src = imgSrc;
            document.getElementById('zoomTitle').innerText = title;
            document.getElementById('zoomModal').classList.add('active');
        }

        function closeZoomModal() {
            document.getElementById('zoomModal').classList.remove('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function toggleCart() { document.getElementById('cartModal').classList.toggle('active'); }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-bold py-3 px-6 rounded-2xl shadow-xl z-50 transition opacity-0';
            toast.innerText = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => renderProducts(e.target.value));
        
        initSizeFilter();
        renderProducts();
    </script>

    <!-- Modal de Zoom -->
    <div id="zoomModal" class="zoom-modal fixed inset-0 bg-black/90 z-50 items-center justify-center p-2 md:p-6">
        <div class="bg-white rounded-3xl p-4 max-w-4xl w-full relative flex flex-col items-center shadow-2xl max-h-[95vh]">
            <button onclick="closeZoomModal()" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 w-11 h-11 rounded-full flex items-center justify-center transition z-10 shadow"><i class="fas fa-times text-xl text-gray-800"></i></button>
            <h3 id="zoomTitle" class="font-bold text-lg text-gray-900 mb-3 text-center px-10"></h3>
            <div class="w-full flex-1 flex items-center justify-center overflow-auto bg-orange-50/50 rounded-2xl p-2 min-h-[50vh]">
                <img id="zoomImg" class="max-w-full max-h-[75vh] object-contain rounded-xl shadow-md">
            </div>
            <button onclick="closeZoomModal()" class="mt-4 w-full md:w-64 py-3 bg-[#1f3159] text-white rounded-xl font-bold text-sm shadow hover:bg-[#15223f] transition">Cerrar Zoom</button>
        </div>
    </div>

    <!-- Modal de Detalles -->
    <div id="modal" class="modal fixed inset-0 bg-black/50 backdrop-blur-xs z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black"><i class="fas fa-times text-xl"></i></button>
            <img id="modalImg" class="w-full h-56 object-contain rounded-2xl mb-3 bg-orange-50/50 cursor-pointer" onclick="openZoomModal(this.src, document.getElementById('modalTitle').innerText)" onerror="this.src='https://placehold.co/300x300/e8a598/ffffff?text=MarIv';">
            <div id="modalBadge"></div>
            <h2 id="modalTitle" class="text-xl font-bold mb-1 text-gray-900"></h2>
            <p id="modalMaterial" class="text-gray-600 text-xs mb-3"></p>
            <p id="modalPrice" class="text-[#1f3159] font-bold text-xl mb-3"></p>
             
            <label class="block text-sm font-bold text-gray-700 mb-2">Selecciona tu talla o medida:</label>
            <select id="sizeSelector" class="w-full p-3 border border-orange-200 rounded-xl mb-6 text-sm bg-white focus:ring-2 focus:ring-[#1f3159] outline-none"></select>

            <button id="addBtn" class="w-full py-4 bg-[#1f3159] text-white rounded-xl font-bold hover:bg-[#15223f] transition shadow-md">Agregar al Carrito</button>
        </div>
    </div>

    <!-- Modal del Carrito -->
    <div id="cartModal" class="cart-modal fixed inset-0 bg-black/50 backdrop-blur-xs z-50 items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full relative shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-gray-900">Tu Pedido</h2>
            <div id="cartList" class="mb-4 max-h-60 overflow-y-auto"></div>
            
            <div class="space-y-2 mb-6 border-t pt-4 border-gray-100">
                <div class="flex justify-between text-sm text-gray-600"><span>Subtotal:</span><span id="subtotal" class="font-bold text-gray-800">$0</span></div>
                <div class="flex justify-between text-sm text-gray-600"><span>Envío:</span><span id="shippingFee">Por cotizar</span></div>
                <div class="flex justify-between text-lg font-bold text-gray-900"><span>Total:</span><span id="cartTotal">$0 + Envío</span></div>
            </div>

            <button onclick="checkout()" class="w-full py-4 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold transition shadow-md mb-2 flex items-center justify-center gap-2">
                <i class="fab fa-whatsapp text-lg"></i> Pedir por WhatsApp
            </button>
            <button onclick="toggleCart()" class="w-full py-2 text-gray-500 hover:text-gray-800 text-sm font-medium">Cerrar</button>
        </div>
    </div>
</body>
</html>
